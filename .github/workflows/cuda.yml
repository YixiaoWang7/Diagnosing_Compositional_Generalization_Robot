name: CUDA acceptance
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cuda:
    # Register a maintained Linux runner with one supported CUDA GPU and this label.
    runs-on: [self-hosted, linux, gpu]
    strategy:
      matrix:
        python: ['3.10', '3.11']
    env:
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '${{ matrix.python }}'
      - run: python -m pip install torch==2.9.1 torchvision==0.24.1 --index-url https://download.pytorch.org/whl/cu128
      - run: python -m pip install -c constraints/training.txt '.[dataset,opencv,torchcodec,vision,logging,dev]' './projects/corl2026_cg[dev,video]'
      - run: python -m pip check
      - run: python -m pytest tests -q --strict-markers
      - run: python -m pytest -c projects/corl2026_cg/pyproject.toml projects/corl2026_cg/tests -q -m 'not simulator' --strict-markers
